[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cicd-scanner"
version = "0.1.0"
description = "Static security scanner for GitHub Actions workflows: exposed secrets, risky configuration, outdated/vulnerable actions."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
web = ["Flask>=3.0"]
dev = ["pytest>=8", "Flask>=3.0"]

[project.scripts]
cicd-scan = "cicd_scanner.cli:main"

[tool.setuptools.packages.find]
include = ["cicd_scanner*"]

[tool.setuptools.package-data]
cicd_scanner = ["data/*.json", "web/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
